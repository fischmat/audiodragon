name: Audiodragon Push Action
run-name: Push Action for ${{ github.sha }} on ${{ github.ref_name }}
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16
      - run: java -version
      - run: ./gradlew test
      - run: ./build.sh
      - run: npm ci --prefix desktop
      - run: npm test --prefix desktop
      - run: npm run package:linux --prefix desktop
      - name: Upload Linux desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: audiodragon-linux-appimage
          path: desktop/dist/*.AppImage
          if-no-files-found: error
